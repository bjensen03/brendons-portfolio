# Quick overview: the condensed read (2–3 minutes), shown by the
# Quick overview / Full case study switch. The full study above is unchanged.
overview:
  glance: true
  hook: I'm constantly **trail running, canyoneering and backpacking**, so I built my own full-stack app to make sure I eat enough, and we still use it regularly.
  sections:
    - heading: What I built
      body: |
        It plans one set of meals for two people with different calorie and protein targets and splits each pot into **two portions**, then turns the week into a grocery list and budget.

        It's covered by **1,491 automated tests**.
      labels: ['Next.js', 'TypeScript']
      show: ['viewer:week']
    - heading: How it's built
      body: |
        Every write goes through a server action into Postgres on Neon through Drizzle, across 16 tables. Sign-in is Google with an allowlist that **fails closed**.

        Claude Code helped me with development, and the test suite is how I checked what it wrote.
      labels: ['Server actions', 'Postgres (Neon)', 'Drizzle ORM', 'Auth.js']
      show: ['mockup:week-setup']
    - heading: Engineering Deep Dive
      body: |
        The budget said $437 for a week that cost $250, because the app priced weighed items as whole packages. I added a `soldByWeight` flag to the 18 weighed ingredients so they're charged for the share they use, while jars and sealed packs still round up.

        The tests pin the edge cases. I don't have a verified after-total, so I don't claim one.
      labels: ['TypeScript', 'Vitest']
      show: ['hardProblem']
    - heading: Reflection
      body: |
        Building features is one thing. Making sure the budget and the planning work together in everyday use matters just as much.
      labels: ['Testing', 'Everyday use']
