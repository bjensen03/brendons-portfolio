situation: |
  I'm constantly trail running, hiking, canyoneering, backpacking and traveling. Those days put my body through hard, exhilarating situations, and to keep doing them on a regular basis I need ==enough food and protein==.

  I wanted an app that would keep track of that for me and make it easier to eat what I need. So I built one.

  The app is for two people with different calorie and protein targets cooking one set of meals.

  It has to work standing at the stove, deciding how much of tonight's pot is whose.

  It has to work in a grocery store, with the list open on a phone.

  And it has to work when packing food for a canyoneering day, where everything has to be carried.

  The money mattered too. At one point the budget said a week cost $437.16 when the receipt said $250. ==The one screen about money was the one giving the wrong answer.==

myRole: |
  I built it on my own.

  I wrote the spec, designed it, and built everything: the planner, the portioning, the grocery list, the cost estimate, the Trail Bin for hiking food, AI recipe generation, and the test suite.

  Nothing was in place before me except the services it runs on: Neon, Vercel, Google sign-in, and the Anthropic API.

  I had wanted to build my own application for a while, but I knew it was going to be a bigger project than what I had worked on before. I used Claude Code to help with development, work through technical challenges, and understand things as I was building.

  AI was a big part of the development process, but ==the project came from something I personally wanted to create and use==. I was involved in shaping the features, figuring out what worked, and making changes based on how we used the app.

  I didn't take what it wrote on trust. The 1,491 automated tests are how I checked the code, and anything the app generates itself, like a recipe draft, is checked again on the server before it's saved.

  One of the biggest things I took away from the project was ==how much I learned throughout the process==. It gave me experience working through a larger application, and it's something I want to keep improving and building on.

atAGlance:
  - value: 17 days
    label: To build the first version
    note: 25 August to 10 September 2026.
  - value: '1,491'
    label: Automated tests, all passing
    note: From a Vitest run on 22 October 2026, which includes work after September.
  - value: '104'
    label: Ingredients modeled
    note: 36 of them with a recorded piece weight.

keyDecisions:
  - heading: Only give an ingredient a piece count when the piece is honest
    body: |
      "2 chicken breasts" is easier to shop for than "425 g", so every ingredient could have been given a count.

      But shrimp, a cabbage head and a rotisserie chicken vary by two or three times per piece.

      ==A count that is not honest reads as precise== while being worse than the weight it replaced.

      So 36 of the 104 ingredients have a piece weight, and the rest stay in grams.

      Every piece weight is pinned in a test, so a new ingredient cannot be added without a decision about its piece.
  - heading: Split one cooked recipe into two different portions
    body: |
      Kaylee and I eat dinner together, and ==we're not going to cook two completely different meals every night==. We also wanted to be more intentional about our portions and weight goals.

      The idea was to cook one meal but have the app calculate how much each of us should eat based on our individual needs.

      The solver might say 425 g of chicken. Nobody shops that way, so the list rounds to what you can actually buy, and the cooking screen splits one pot into two unequal servings.
  - heading: Google sign-in plus a two-email allowlist
    body: |
      Signing in with Google proves who you are. It does not prove you are allowed in.

      I wanted the application to be private so only the two of us could use it. The allowlist is what keeps it that way.

      I tested it with another Google account, and ==it was denied access==.
  - heading: A week already shopped for keeps its old maths
    body: |
      When the over-buying bug was fixed, a saved week with no recorded yield kept the previous arithmetic.

      That way a list someone had already shopped from did not silently change underneath them.

hardProblem:
  title: A budget 75% too high
  punchline: The grocery budget said $437 for a week that cost $250 at the till, because the app priced every item as whole packages when a meat counter charges for exactly what the scale weighs.
  problem: |
    The weekly cost came out at $437.16 against a real receipt of $250. That is 75% too high, on the only screen about money.

    One line showed it clearly: 1,020 g of salmon charged as three 1 lb packs at $36.00.
  assumption: |
    When I saw the budget showing $437 against a $250 grocery receipt, I knew something wasn't adding up.

    It made me realize that ==just because a feature works doesn't necessarily mean it's calculating everything correctly==. I needed to look more closely at how the budget was being calculated.
  found: |
    A scale sets the price at the meat counter, the deli slicer and the produce bin.

    The counter weighs out 2.25 lb of salmon for $26.96. Nobody sells half a jar.

    ==The app had one rule for two kinds of item.== Eighteen ingredients are sold by weight.
  fix: |
    I worked on correcting the budget calculations so the numbers would better reflect our actual grocery spending.

    I added a `soldByWeight` flag and set it on those 18 ingredients, so they charge the exact share and show the per-pound price instead of naming a package nobody had to buy.

    Jars, cartons and sealed bacon still round up, because you really do buy the whole thing.

    The waste figure now counts only the rounded lines.
  verified: |
    I don't have a verified before-and-after total for that specific week, so I'd rather explain what I fixed than claim a result I can't confirm.

    The tests are the check. They pin the edge cases: bacon and shrimp are priced per pound but still come sealed, and Swiss cheese is shelf-priced but sliced to order.
  code:
    - snippet: groceryCost
      caption: A weighed line is charged for the share it uses. Everything else still rounds up to whole packages.

result: |
  We still use it regularly. I built it so I could eat what I need for the things I do, and ==it's turned into something we actually use== instead of just a project I finished and forgot about.

  The list now buys each recipe once per batch instead of once per portion.

  The budget prices weighed items by weight instead of by packages nobody sells.

differently: |
  I would spend more time making sure the grocery budget and meal planning work together correctly from the beginning.

  I'd also improve how food groups are organized and make it easier to grab everything we need for the week.

  I learned that ==building features is one thing, but making sure they work together in everyday use is just as important==.

