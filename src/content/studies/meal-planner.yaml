inShort:
  - I'm constantly trail running, hiking, canyoneering, backpacking and traveling. It's hard on my body, and I need ==enough food and protein== to keep it up week after week.
  - So I built an app to keep track of it. We cook one meal and it calculates ==how much each of us should eat== based on our individual needs.
  - The budget said a week cost $437 when the receipt said $250, so I fixed it to ==price weighed items by weight== instead of by packages nobody sells.
  - We still use it regularly. It's turned into something we actually use instead of just a project I finished and forgot about.

