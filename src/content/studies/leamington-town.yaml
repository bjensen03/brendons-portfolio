inShort:
  - Leamington is a small pioneer town in Millard County, Utah, established in 1880. This is ==the town's official website==.
  - It needed to feel like Leamington rather than a government template, so it opens on the town's pioneer heritage mural and pairs a classic serif with a handwritten script.
  - It also had to meet Utah's Government Data Privacy Act, so I added ==a website privacy notice==, a cookie banner and a notice before anyone downloads a town form.

situation: |
  leamingtontown.gov holds the town's services, documents and a lot of local history.

  It had three jobs. Residents need to find town services quickly. The site should feel like Leamington, not a generic government portal. And under Utah's Government Data Privacy Act it needed a privacy notice, plus a notice wherever a form collects personal information.

myRole: |
  I designed and built the town's custom WordPress theme.

  Along with it I built the Website Privacy Notice page, the cookie banner and the notice that appears before a form download, fixed the color contrast that failed WCAG AA, and did a pass to make the site work properly on phones.

