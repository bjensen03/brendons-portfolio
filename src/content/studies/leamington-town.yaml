story:
  - heading: A town, not a template
    body: |
      The home page opens on the town's "150 Years of Pioneer Heritage" mural, with a dark overlay so the title stays readable. There's ==one button, Explore Town Services==, instead of a row of equal choices.

      Headings are Playfair Display and body text is Inter. Mrs Saint Delafield adds a handwritten script accent, like the "How Can We Help?" above Town Services.

      The colors are warm cream, deep umber, ochre and sage, so the site feels western without being kitschy.
  - heading: Services, heritage and the footer
    body: |
      Town Services is four groups: Town Council, Public Works, Planning & Zoning and Town Documents. Each one opens in place, so ==the page stays short and every link is one tap away==. Planning & Zoning holds the county building permit, the town zoning maps and land use applications.

      The "A Legacy of Heritage" card puts the town's address, phone number and population beside its story, with an Est. 1880 mark.

      The footer keeps the Town Hall details and quick links, with a legal strip underneath on every page: Privacy Notice, Contact and Public Records.
  - heading: Privacy and consent
    body: |
      The Website Privacy Notice is split into numbered sections, from what the site collects to cookies, data retention and your rights. It opens with a list of the sections, names the town clerk as the contact, and cites the Utah Government Data Privacy Act.

      The cookie banner is part of the theme, with no outside consent service. It offers "Decline non-essential" and "Accept all", and saves the choice so analytics only runs if someone accepts.

      Town forms are PDF, Word, Excel and OpenDocument files. Clicking a link to one opens ==a Personal Data Collection Notice first==: what the form collects, why, how it's used and kept, and that it's voluntary. You can cancel or continue to the form, Escape closes it, focus stays inside it, and once you continue it doesn't ask again that session.
  - heading: Contrast and phones
    body: |
      The ochre button and the cream footer labels didn't have enough contrast to pass WCAG AA. The button now uses a darker ochre, and the footer labels are white.

      On phones, the hero title scales with the screen, the page can't scroll sideways, form fields are big enough that iOS doesn't zoom in when you tap one, buttons and links are easy to hit, and animation respects reduced motion.

result: |
  The site is live at leamingtontown.gov. It looks like Leamington, keeps town services a tap away, and has the privacy notice, cookie consent and form notices the town needed under Utah's privacy law.

  - [Visit leamingtontown.gov](https://leamingtontown.gov/)

