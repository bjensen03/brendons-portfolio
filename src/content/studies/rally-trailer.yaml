inShort:
  - What started as a website I was maintaining became ==a platform I designed== around how Rally actually markets, sells trailers, works with dealers, and supports its operations.
  - I built a ZIP-code system that connected a customer with the correct dealer based on their location — I built ==a private dealer portal== inside the website.
  - The site that once took around 26 seconds to load ==now loads in under two seconds== after the rebuild and continued optimization.

