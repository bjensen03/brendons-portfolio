eras:
  heading: How the project evolved
  intro: |
    The rebuild did not happen because I came in and immediately decided page builders were bad.

    It happened in stages.
  items:
    - year: '2022'
      title: The site I inherited
      url: rallytrailermfg.com
      shots:
        - src: rally-trailer/eras/2022-salient-home.webp
          alt: The 2022 Rally site — a grey hero reading "Reel Trailers. Real Differences. Real Tough." with Find a Dealership and Learn More buttons.
        - src: rally-trailer/eras/2022-salient-section.webp
          alt: The 2022 site's "Your Trusted Choice of Reel Trailers" row — Manual, Hydraulic, Turret and Gas Utility.
    - year: '2025'
      title: Work with what Rally already had
      url: rallytrailermfg.com
      body: |
        I inherited the Salient, WPBakery, Elementor, and Hello Elementor setup and started fixing the biggest problems inside it.

        I rebuilt pages in Elementor, cleaned up layouts, fixed bugs, improved mobile behavior, and worked on performance.

        It helped, but the site still had multiple builders, multiple themes, multiple caches, and performance problems.
      shots:
        - src: rally-trailer/eras/2025-elementor-industries.webp
          alt: The 2025 Elementor site — trailers split by industry, Telecom, Gas, Energy, Pole Trailers and Truck Beds.
        - src: rally-trailer/eras/2025-elementor-grid.webp
