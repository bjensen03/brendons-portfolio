# Quick Overview.
# Every line is sourced from this file; see his notes for line numbers.
overview:
  glance: true
  sections:
    - heading: Overview
      body: |
        I'm the main person responsible for Rally's website and most of the web work around it. I work directly with marketing, sales, operations, leadership and dealers.

        When adding more to the old setup stopped making sense, I put together a plan to rebuild the site as one custom WordPress theme. Once it was approved, I owned the rebuild, from the site structure to the dealer tools.
      labels: ['WordPress', 'Custom theme']
    - heading: The Challenge
      body: |
        The site I inherited was a mix of WordPress systems. It started on Salient and WPBakery, Elementor and Hello Elementor were added later, and more than one caching system ran at the same time.

        Every new feature made it harder to maintain, and Rally kept asking for things a page builder was never meant to handle, like dealer territories, lead routing and a dealer portal. The website was becoming part of how Rally sold trailers.
      labels: ['WPBakery', 'Elementor', 'Hello Elementor', 'LiteSpeed']
      show: ['eras']
    - heading: The Solution
      body: |
        I rebuilt it as one custom WordPress theme that runs the public site, trailer data, dealer routing and lead management in one system.

        The forms stopped asking customers for things the site already knew. On a trailer page the trailer is filled in, and the customer's ZIP code decides their state and dealer territory.

        I also built a private dealer portal, where each dealer has their own login and only sees their dealership, and a production board for the shop floor.
      labels: ['PHP', 'ACF Pro', 'Dealer routing', 'Custom roles']
      show: ['viewer:buy-now']
    - heading: Engineering Deep Dive
      body: |
        The operations team reported that changes in the dealer portal weren't saving. Trailers added to a dealer's lot disappeared, and lead statuses went back to "New." I couldn't reproduce it; on production, my changes stuck.

        I first suspected the save logic, but the status handler and database updates were working. So I checked the affected accounts' network requests. The portal's AJAX calls were returning 403 Forbidden, because WordPress was rejecting the security nonce.

        The host's LiteSpeed cache was serving logged-in users cached portal pages with old tokens. My admin session always got a fresh page, which is why it worked for me.

        I excluded the portal and its AJAX endpoints from the cache, kept the nonce checks, and made the portal show a retry message when a save fails. Then I ran the full dealer workflow on production with a separate account, confirmed the 403s were gone, and checked the response headers for caching.
      labels: ['LiteSpeed Cache', 'WordPress nonces', 'AJAX']
      show: ['hardProblem']
    - heading: Results
      body: |
        **Load time: about 26 seconds → under 2 seconds.** That came from the rebuild and the optimization work after it.

        More than 30 trailer models now have structured product pages, and marketing builds and rearranges pages from 27 reusable modules without needing a developer for every layout change.

        I don't own Rally's sales analytics, so I won't claim a sales increase I can't verify.
      labels: ['Performance', 'Reusable modules']
      show: ['mockup:ipad']
    - heading: Reflection
      body: |
        I'd set up a staging environment that matches production first. The portal bug only showed up on production, because that's where LiteSpeed behaved differently.

        I'd also move deployments toward Git-driven releases and write the internal documentation earlier, so the next developer doesn't have to reverse-engineer why everything works the way it does.
      labels: ['Staging', 'Git-driven releases', 'Documentation', 'Deployment']
