        - src: rally-trailer/eras/2025-elementor-trailer.webp
          alt: A 2025 trailer page — color picker, Buy Now and Rent Now buttons, and the specifications as a text list.
    - year: '2026'
      title: Propose the rebuild
      url: rallytrailermfg.com
      body: |
        At that point, the business had outgrown the architecture.

        I proposed rebuilding the site as ==one custom WordPress theme== that could handle the public website, trailer data, dealer routing, lead management, and future tools in one system.

        The plan was approved, and ==I took ownership of the rebuild==.
      shots:
        - src: rally-trailer/eras/2026-home.webp
          alt: The 2026 custom theme home page — "Designed by people in the field. For crews who are out there every day." with Buy Now and Rent to Own.
        - src: rally-trailer/eras/2026-grid-filters.webp
