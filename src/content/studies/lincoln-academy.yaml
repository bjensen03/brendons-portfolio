keyDecisions:
  - heading: Build navigation around what people actually use
    body: |
      One of the biggest complaints from the survey was that it took too long to find common information.

      People should not have to click through four pages to find something they use every week.

      So I simplified the navigation and started putting the most-used links where people naturally look for them.

      That included quick-link areas, a cleaner main navigation, useful links in the footer, and links placed directly on the pages where they were relevant.

      I also added search in more places so someone who knows what they are looking for does not have to understand the school's site structure first.

      The goal was simple.

      ==Make the common things easy to find.==
  - heading: Build mobile as a real experience, not a smaller desktop site
    body: |
      Parents and staff specifically called out mobile in the survey.

      That mattered because a lot of school information is checked quickly from a phone.

      A parent might be looking for a calendar date in the parking lot.

      A teacher might need a form between classes.

      Someone might be looking for a staff extension while already on the way to the school.

      I rebuilt the site so those experiences were considered from the beginning instead of being squeezed down after the desktop layout was finished.
  - heading: Replace Divi with something the school could actually maintain
    body: |
      The old site relied heavily on Divi and several plugins.

      That made simple content changes more complicated than they needed to be.

      I rebuilt the site as a custom PHP WordPress theme using ACF.

      The layout stays controlled in code, but the content that staff actually needs to change lives in clear fields.

      That means somebody can update text, links, images, documents, or other school information without understanding how a page builder was assembled.

      The goal was not just to make the new website easier for me to develop.

      It needed to be ==easier for Lincoln to run after I finished building it==.
  - heading: Build one staff directory that works differently for public and internal users
    body: |
      The staff directory was one of the areas administration really wanted improved.

      Families need to be able to find teachers and staff quickly.

      They need things like names, roles, extensions, and useful teacher links.

      At the same time, not every staff member or every piece of staff information should be publicly visible.

      I built the directory so public visitors see the information meant for families, while logged-in staff can see additional internal information.

      That let us keep one structured directory instead of maintaining separate lists in different places.

story:
  - heading: Parent and staff feedback
    placement: afterSituation
    body: |
      Before the school year ended, we sent an anonymous Qualtrics survey to parents and staff.

      I wanted the rebuild to be ==based on what people were actually frustrated with==, not just what I thought needed to change.

      The survey asked four questions about how people used the website, what bothered them, and what they wanted to see improved.

      Several themes kept coming up.

      People said the mobile site felt like a smaller version of the desktop site instead of something designed for a phone.

      Finding basic information could take several clicks.

      Navigation was confusing.

      Pages were slow.

      The interface did not always make sense.

      Parents wanted easier access to the things they used regularly instead of having to search through pages aimed at prospective families.

      Lunch information was difficult to find.

      People wanted quick links.

      They wanted better search.

      They wanted the website to feel simpler.

      I used that feedback as the starting point for the new site.
  - heading: Building around the school day
    body: |
      The site has several different groups using it, and each one needs something different.

      ### Parents and families

      Parents need to find information quickly.

      That includes:

      - Staff and teacher information
      - School policies
      - Lunch information
      - Parent Teacher Conferences
      - Announcements
      - Calendars
      - Forms
      - Program information
      - Quick links

      I tried to remove unnecessary steps between the parent and the thing they are trying to find.

      ### Teachers and staff

      Staff need more than public information.

      They need tools.

      ### Administration and office staff

      Administration needed school information to stay organized without every change becoming a development request.

      That includes:

      - Staff information
      - Board updates
      - Government documents
      - School policies
      - Newsletters
      - Program pages
      - Announcements
      - Internal resources

      I structured those areas so they could be updated from the WordPress dashboard instead of buried inside Divi layouts.
  - heading: Rebuilding lunch ordering
    body: |
      A generic form can collect someone's lunch choice.

      That does not mean it can run a lunch program.

      The kitchen needs to know who submitted.

      They need to know who did not.

      They need to know which students are missing.

      They need totals for each meal.

      They need labels.

      They need information they can use quickly before lunch starts.

      So I built a custom lunch-ordering system around that workflow.

      Teachers submit their class orders through the site.

      The lunch manager has her own dashboard where she can see:

      - Submitted classes
      - Missing classes
      - Missing students
      - What each student ordered
      - Daily meal totals
      - Printable information
      - Downloadable CSV data
      - Pre-populated labels
      - Reminder tools

      Before, a lot of that work required manually checking information and typing or writing labels.

      Now the website prepares much of it automatically.

      That gives the lunch staff more time to focus on actually preparing and serving lunch instead of spending the morning organizing data.
  - heading: Improving communication with families
    body: |
      My role at Lincoln also includes helping communicate what is happening around the school.

      Every Monday, I put together and send the school newsletter.

      I redesigned that experience so it is easier to scan and gives families a clearer view of upcoming events, announcements, and important information.

      I also made calendar dates easier to use so families can add relevant events to their own calendars instead of manually creating them.

      On the website, I added an announcement area for information that needs to be seen quickly.

      That gives the school another way to communicate important updates without expecting every family to hunt through individual pages.

      The website, newsletter, calendar, and announcements now work more like parts of the same communication system instead of separate things.
  - heading: Forms and automation
    body: |
      Forms are also a major part of the website.

      Lincoln already had Formidable forms connected to Zapier automations, and several school workflows depended on those exact forms and field IDs.

      That meant the rebuild had an important constraint.

      I could change almost everything around them, but I could not casually rebuild those forms and break the automations people were already using.

      I kept the existing Formidable and Zapier structure intact where it needed to stay intact, then built the new website around it.

      That allowed the school to keep using its existing workflows while the rest of the site changed underneath them.

      This includes things like staff requests, school forms, event-related requests, and other workflows that route information to the right people.
  - heading: Accessibility
    body: |
      Accessibility was also part of the rebuild from the beginning.

      A school website needs to work for more than one type of user.

      I worked on:

      - Keyboard navigation
      - Better heading structure
      - Color contrast
      - Screen-reader labels
      - Alt text
      - Clear form labels
      - More consistent templates

      Instead of trying to fix accessibility one page at a time after launch, I wanted the theme itself to create a better starting point for every page.

      That makes accessibility easier to maintain as new content is added.

hardProblem:
  punchline: Refreshing the lunch dashboard could send the same reminder again because the action had no memory of who had already been contacted.
  problem: |
    Teachers who missed the lunch-order cutoff were supposed to receive one reminder.

    Instead, some teachers were getting the same reminder more than once.

    That was frustrating for them and made the system look unreliable.
  assumption: |
    My first thought was that somebody was clicking the reminder button several times or that some scheduled process was accidentally running more than once.

    The number of duplicate emails made that seem like the obvious explanation.
  found: |
    The reminder was not actually automated.

    It was triggered through a protected URL in the kitchen dashboard.

    The security token stayed valid long enough that refreshing the page could run the reminder action again.

    If another admin opened the same URL, it could run again there too.

    Each time that happened, everyone who was still marked as missing received another email.

    The system knew who still needed to submit lunch.

    ==It did not know who had already been reminded.==

    **That was the real problem.**
  fix: |
    I changed the reminder process so it remembers who has already been contacted that day.

    Before sending an email, the system checks the day's reminder record.

    If that teacher has already received one, they are skipped.

    If the email sends successfully, that teacher is added to the record.

    That means refreshing the page, clicking the button twice, or having another admin open it does not send the same reminder again.

    I also updated the email handling so replies go back to the kitchen instead of somewhere unrelated.
  verified: |
    After the fix, I deliberately triggered the reminder several times.

    The first send worked normally.

    Every attempt after that skipped the teachers who had already been contacted and ==sent zero duplicate emails==.

    Then I tested with a teacher who had not been reminded yet and confirmed that person still received exactly one.

result: |
  The biggest change is that Lincoln's website now feels much more like ==a tool for the people who are already part of the school==.

  I do not have a conversion number to attach to a school website, and that would not be the right way to judge this project anyway.

  The result I care about is that parents can find things faster, staff have better tools, and departments can do more of their work without fighting the website.

  The old website had become a collection of pages and plugins.

  The new one is built much more closely around how the school actually works.

differently: |
  The first thing I would change is the staging and launch process.

  I would want ==a staging environment that mirrors production== as closely as possible and a narrower deployment process instead of moving more of the database than necessary.

  That would make production-only issues easier to catch before launch.

  I would also create a formal content-parity checklist before migration.

  With a site this large, it is easy for one old page, external tool link, or program resource to get missed.

  A checklist would make every old page and important link something that gets intentionally kept, replaced, redirected, or removed.

  Finally, I would automate more of the final QA.

  Broken-link checks, accessibility scans, and other basic tests should happen before deployment instead of waiting for a parent or staff member to find the problem.

