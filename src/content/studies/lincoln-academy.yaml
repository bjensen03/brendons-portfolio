  - id: field-trips
    heading: Field trip and event requests
    intro: |
      This includes things like staff requests, school forms, event-related requests, and other workflows that ==route information to the right people==.
    steps:
      - tab: 2025 form
        group: Before
        title: The 2025 event request form
        url: lincoln-academy.org
        src: lincoln-academy/webflow-2025/form-event-request-2025.webp
        alt: The 2025 event request form — teacher or staff names, email and phone, event name and date, start, end and setup times, "Is this happening during the school day?", and location or department, with a warning about AM and PM above the times.
        body: |
          It asked for the teacher's name, email and phone, the event name and date, start, end and setup times, whether it was during the school day, and the location or department.

          A line above the times warns that the event will not make it to the calendar if AM and PM are wrong.

          Behind it was a 2025 Zap. Each request sent an email, added a spreadsheet row, then split into approve and deny paths for two admin approvers. Once a request was fully approved, it went onto the Lincoln Academy calendar, and IT, Facilities and Communications each got a task on a master school sheet.
