          width: 1600
          height: 772
          crop: { x: 0.15, y: 0.03, w: 0.85, h: 0.826 }
        body: |
          Two approvers get the approval request first. Either one can approve it.
      - tab: Routing
        group: Now
        title: Only the people who need it
        url: docs.google.com/spreadsheets
        src: lincoln-academy/field-trip/tracking-sheet.webp
        alt: The Field Trip Request tracking sheet — lunches and drivers needed, Admin Approval or Admin Denied, the denial reason, Lunch Approval, the approvers' column and the Request ID.
        detail: { x: 0.45, y: 0.15, w: 0.5, h: 0.45 }
