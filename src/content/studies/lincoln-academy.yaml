# Quick Overview: the condensed read behind the "Quick overview | Full case
# study" switch. Built from this file's own sections; every sentence is
# backed by a line above.
overview:
  glance: true
  sections:
    - heading: Overview
      body: |
        Lincoln Academy is a K–9 charter school in Utah. I was the solo developer and designer on its website rebuild. I planned the structure, designed it, built the custom WordPress theme, migrated the content, built the internal tools and handled the launch.

        I was already on the school's operations team, so I was building for people I worked with every day.
      labels: ["WordPress", "PHP", "ACF Pro"]
    - heading: The Challenge
      body: |
        The old site was Divi pages, plugins, forms, documents and staff content added over time, and every change inside Divi was getting harder.

        Lunch ordering was breaking down too. After the school moved to Infinite Campus, the old roster process stopped staying current.

        In an anonymous survey, parents and staff said the mobile site felt like a shrunken desktop site, the navigation was confusing, and basic information took several clicks to find.
      labels: ["Divi", "Infinite Campus"]
      image: { src: lincoln-academy/webflow-2025/old-home-attendance-banner.webp, alt: "The old Divi home page in 2025, with an \"Attendance Concerns?\" slide and a bar of links under a two-sided menu." }
    - heading: The Solution
      body: |
        I rebuilt the site as a custom PHP theme with ACF, with the layout in code and content in clear fields. Around it I built three custom plugins, for staff forms, lunch ordering and internal ticketing.

        Staff sign in through Google to a private staff portal.

        Formidable forms already fed Zapier by field ID, so I kept them and built around them.

        A field trip request gets an ID like FT-123456, goes to two approvers, then only to the people who need it. A rejected one comes back with a link to pick a new date.
      labels: ["ACF Pro", "Custom plugins", "Google SSO", "Formidable", "Zapier"]
      show: ["viewer:lunch", "viewer:field-trips", "feature:staff-login"]
    - heading: Engineering Deep Dive
      body: |
        Teachers who missed the lunch cutoff were supposed to get one reminder. Some got the same one several times.

        My first guess was someone clicking the button more than once, or a scheduled job running twice.

        It wasn't scheduled at all. The reminder ran from a protected URL in the kitchen dashboard, and the security token stayed valid long enough that a refresh, or another admin opening the page, ran it again. The system knew who hadn't ordered. It didn't know who had already been reminded.

        I made it keep a record of who's been contacted each day. It checks the record before sending and adds a teacher only once the email goes out. Replies now go to the kitchen.

        Then I triggered it several times on purpose. It sent zero duplicate emails, and a teacher who hadn't been reminded yet still got exactly one.
      labels: ["PHP", "WordPress", "Email"]
      image: { src: lincoln-academy/lunch/dashboard.webp, alt: "The kitchen dashboard, with the Remind missing and Email summary buttons, the day's meal totals and each class's order, names blurred." }
    - heading: Results
      body: |
        **The kitchen cut its time in half** with custom labels on every lunch item in the new dashboard.

        About 200 pages were rebuilt, migrated or reorganized, and the three custom plugins are built around how the school actually works.

        I don't have a conversion number for a school website, and that wouldn't be the right way to judge it anyway.
      labels: ["Lunch dashboard", "Migration"]
      image: { src: lincoln-academy/lunch/labels.webp, alt: "The Lunch Labels page, with special student meals and staff meals filled in and names blurred." }
    - heading: Reflection
      body: |
        I'd want a staging environment that mirrors production, and a narrower deployment that doesn't move more of the database than it needs to.

        I'd also write a content-parity checklist before migrating a site this size, and run broken-link and accessibility checks before a deploy instead of waiting for a parent to find the problem.
      labels: ["Staging", "QA"]
