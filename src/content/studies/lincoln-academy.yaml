      Forms are also a major part of the website.

      Lincoln already had Formidable forms connected to Zapier automations, and several school workflows depended on those exact forms and field IDs.

      That meant the rebuild had an important constraint.

      I could change almost everything around them, but ==I could not casually rebuild those forms== and break the automations people were already using.

      I kept the existing Formidable and Zapier structure intact where it needed to stay intact, then built the new website around it.
