# Composed from: situation (first and last lines); myRole (first two
# paragraphs); my notes on the overall study and on the lunch system.
inShort:
  - Lincoln Academy is a K through 9 charter school in Utah. During the summer, I was given the job of ==rebuilding its website==.
  - I was the solo developer and designer for the rebuild — I planned the new structure, designed the experience, built the custom WordPress theme, migrated the content, built the internal tools, and handled the launch.
  - Inside it, ==a lunch ordering system== for the kitchen and a field trip and event request system — plus the newsletter I send every Monday and a staff login connected through Google.
  - With the new lunch dashboard, the kitchen can add custom labels to every item, ==so they cut their time in half==.

