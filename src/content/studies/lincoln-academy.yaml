situation: |
  By the time I started planning the rebuild, the website had grown into a mix of Divi pages, plugins, staff-only content, forms, documents, directories, newsletters, school resources, and other systems that had been added over time.

  ==It worked, but it was getting harder to manage.==

  Different departments needed different things from the website, and making those changes inside the existing Divi setup was becoming more difficult.

  The staff directory needed more information and better organization.

  Government and school-board documents needed to stay organized and easy to find.

  Staff needed private resources.

  Parents needed quick access to school information.

  The lunch-ordering process was becoming harder to maintain after the school moved to Infinite Campus and the old roster process stopped staying current.

  The website had also become ==more focused on explaining Lincoln to prospective families== than helping the parents, teachers, and staff who were already using it every day.

myRole: |
  I was already part of Lincoln's operations team, which meant I was working directly with the people who would use what I was building.

  I talked with the lunch team about what they needed every morning.

  I worked with finance on how their information should be organized.

  I worked with administration on the staff directory, private resources, and other school information.

  I also continued working on forms, automations, newsletters, announcements, and the other web systems the school already relied on.

  This was not just a website redesign.

  I was rebuilding the public site while also improving several of the workflows running through it.

