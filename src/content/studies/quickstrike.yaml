situation: |
  I was brought in on the marketing-side web work because the team needed someone who could move quickly and get projects finished without waiting weeks for the normal development queue.

  QuickStrike was one of the bigger examples.

  The marketing site was built on an older PHP and Mustache setup with a full-screen parallax design that had not aged well, especially on mobile. The site still worked, but it did not match the way QuickStrike wanted to present itself anymore.

  QuickStrike is mainly built for dealers looking for a manufacturing partner for custom team apparel.

  Those dealers need to quickly understand what QuickStrike can manufacture, what its facilities look like, what technology and capabilities it has, and whether they can trust the company to handle their customers' orders.

  That means the website has to do more than look good. It needs to make the company feel established, capable, and easy to work with before a dealer ever reaches out.

  If the site feels dated, is hard to use on a phone, or does not clearly show what QuickStrike can do, that trust can disappear before a sales conversation even starts.

  The challenge was rebuilding that public-facing experience while staying inside an older production environment that did not have a modern build pipeline and could not simply be replaced with whatever framework I wanted.

myRole: |
  I owned the QuickStrike marketing-site rebuild from the development side.

  The design direction came from our designer. My job was to take those mockups and turn them into a working, responsive production site.

  That included rebuilding all seven pages, handling responsive behavior, writing the CSS and JavaScript, optimizing the assets, building the interactive pieces, testing the site across screen sizes, setting up a preview for feedback, and deploying the finished work to production.

  I also worked with the marketing team throughout the build as changes came in.

  This was not a project where I just received a design file and copied it exactly.

  Some parts of the design needed to change once they were put into a real browser. Text had to scale properly. Logo walls had to work on phones. Videos needed fallback behavior. Animations had to stay smooth. Navigation needed to work across the whole site.

  My job was to keep the design feeling the way it was intended while still making the site practical and easy to use.

  I did not own the original PHP and Mustache structure or the separate dealer login and customizer systems. Those were already in place and lived on different infrastructure.

atAGlance:
  - value: 7 pages
    label: Rebuilt across the marketing site
    note: Home, Tech, Facilities, Contact, Login, Privacy, and History.
  - value: 48 partner logos
    label: Built into a responsive logo system
    note: Instead of using one large exported image, the logos can resize and reorganize properly across desktop and mobile.

keyDecisions:
  - heading: Keep the rebuild simple enough for the environment it actually had to live in
    body: |
      The production server was old and the existing site did not have a modern build system.

      It would have been easy to look at that and decide I needed to rebuild everything in React, Next, or another framework.

      That would have created more problems than it solved.

      QuickStrike is a marketing site. It did not need a new application architecture just to look modern and work well.

      I kept the existing PHP and Mustache structure and rebuilt the front end with plain HTML, CSS, and JavaScript.

      That kept the site lightweight, removed unnecessary dependencies, and meant the existing team could still understand and deploy it without learning a completely different setup.

      The goal was not to use the newest technology. The goal was to build the right thing for the environment I actually had.
  - heading: Turn design files into something that works outside the mockup
    body: |
      Some of the original designs used exported images for large section titles and brand treatments.

      That looked fine in a static design. It did not work nearly as well once the page had to scale down to a phone.

      Instead of keeping those titles as images, I rebuilt them as live text using the actual brand font.

      That gave me control over the size at every breakpoint, kept the text readable, made future wording changes much easier, and avoided loading another image just to display text.

      I made the same kind of decision with the partner-logo section.

      Instead of turning dozens of logos into one large image, I built them as individual elements in a responsive layout.

      On desktop they can spread out. On mobile they collapse into a layout that is still readable instead of shrinking into tiny dots.
  - heading: Use motion to support the brand without making the site harder to use
    body: |
      QuickStrike wanted the site to feel active.

      There are videos, animated sections, logo movement, scrolling effects, and other visual pieces throughout the redesign.

      But the animations still had to work on normal devices.

      I used lightweight JavaScript where I needed movement and relied on browser features like IntersectionObserver and requestAnimationFrame instead of adding a large animation framework to a site that did not need one.

      The goal was to give marketing the energy they wanted without making the site feel heavy.

story:
  - heading: The build
    body: |
      The project touched almost every part of the public-facing marketing site.

      I rebuilt:

      - The homepage
      - Technology pages
      - Facilities
      - Contact
      - Login
      - Privacy
      - Company history
      - Main navigation
      - Footer
      - Partner-logo sections
      - Customer reviews
      - Video sections
      - Responsive layouts
      - Facility information
      - Live local-time displays
      - Forms
      - Mobile navigation and behavior

      One of my favorite pieces was the Facilities section.

      QuickStrike operates across different locations, so instead of showing a static time beside each facility, I built live clocks using JavaScript's timezone tools.

      Someone visiting the site can see the actual local time at each facility instead of having to work it out themselves.

      It is a small feature, but it is the kind of detail I like adding when it actually makes the page more useful.

hardProblem:
  punchline: The site looked correct on preview. The exact same code went to production, and the brand font disappeared.
  problem: |
    After the redesigned site went live, every major heading and navigation item was suddenly using a fallback font instead of Gotham.

    That was a big problem because typography was one of the most visible parts of the redesign.

    The preview environment looked correct. Production did not.
  assumption: |
    My first thought was that it was either browser cache or a different asset path in production.

    Production handled some CSS differently than the preview environment, so it made sense that the font URL might be resolving incorrectly.

    I checked the CSS and the `@font-face` rules. They were correct.
  found: |
    I started checking the font files themselves.

    Instead of returning successfully, the `.otf` files were returning a **403 Forbidden** response.

    That meant the browser was asking for the right file, but the server would not let it read it.

    I checked the file permissions and found the issue. The font files had been copied over with owner-only permissions. The image files were readable by the server. The fonts were not.

    Nothing in the page itself threw a useful error. The browser simply fell back to the next available font.
  fix: |
    I changed the font-file permissions to `644` on production so nginx could read them.

    I also fixed the permissions on my local copies.

    That second part mattered because I did not want to fix production once and then accidentally deploy the same bad permissions again later.
  verified: |
    I checked each font file directly and confirmed they returned a successful response from production.

    Then I loaded the live site and checked the navigation, headings, and footer to make sure Gotham was actually being rendered. The brand typography came back immediately.

    I also added checking critical production assets to my deployment process instead of assuming that a working preview guarantees production will behave the same way.
  code:
    - snippet: fontPermissions

result: |
  QuickStrike went from an older full-screen parallax site to a much cleaner, responsive marketing experience that works across desktop and mobile.

  The new site gives dealers a better way to understand what QuickStrike can manufacture, what its facilities look like, what technology it uses, and whether it is the right manufacturing partner for them.

  It also gave the marketing team a much better way to present the company, its capabilities, its partners, and its customer proof.

  The redesign also gave us a safer way to release work. Instead of going straight from my machine to production, I created a separate preview environment where the team could review the site first. Once everything was approved, I backed up the production version and pushed the final changes live.

  That process is repeatable now.

  I do not have traffic or conversion numbers that I can verify for this project, so I am not going to pretend the redesign increased sales by some percentage.

  What I can stand behind is what changed. The site is easier to use on mobile, more consistent with the brand, easier to maintain, and safer to deploy than the version I started with.

  It also became another example of why I kept getting larger projects. The team could hand me an older codebase I had never worked in before, give me the design and deadline, and trust me to figure out how to get it finished.

differently: |
  The biggest thing I would change is how early I test the real production environment.

  The preview site was useful for design and stakeholder review, but it did not perfectly match production. That is why something like the font-permission issue could make it through every preview check and only appear after launch.

  Now I know not to treat a working preview as proof that the production server will behave exactly the same.

  I would also document more of the deployment process from the beginning. The site does not have a modern CI/CD pipeline, so having a clear written process for preview, backup, deployment, permissions, and production verification matters more than it would on a newer project.

