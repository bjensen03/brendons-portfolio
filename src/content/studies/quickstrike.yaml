inShort:
  - QuickStrike is mainly built for dealers looking for ==a manufacturing partner for custom team apparel==, and its marketing site had a full-screen parallax design that had not aged well, especially on mobile.
  - I owned the rebuild from the development side — ==all seven pages==, the responsive behavior, the CSS and JavaScript, a preview for feedback, and deploying the finished work to production.
  - The site is ==easier to use on mobile==, more consistent with the brand, easier to maintain, and safer to deploy than the version I started with.

