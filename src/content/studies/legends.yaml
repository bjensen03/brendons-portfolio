keyDecisions:
  - heading: Make the storefront feel like Legends, not like a template with a different logo
    body: |
      The site could not just borrow the look of the customizer or another existing site.

      Legends is its own brand.

      That meant the homepage needed its own visual identity, animation style, typography, video treatment, spacing, and content structure.

      At the same time, it still needed to connect into the customizer behind the scenes.

      My job was to keep those two sides separate in the user's experience.

      The visitor should see Legends from the first screen to the hand-off.
  - heading: Make the page editable without giving up the structure
    body: |
      I could have hard-coded the homepage directly into Blade and called it done.

      That would have worked technically, but it would have created more work later.

      Marketing regularly changes photos, videos, copy, links, and featured content. If every update needed a developer, a branch, and a deployment, the page would become harder to maintain almost immediately.

      So I built the homepage around ACF fields while keeping fallback content in the theme.

      That meant the page could still render correctly when the theme was first installed, but marketing could take over the content as soon as the fields were filled in.

      The layout stayed controlled in code. The content did not have to.
  - heading: Keep all customizer links tied to one source of truth
    body: |
      The homepage, navigation, and footer all send users into the uniform customizer.

      There are a lot of sport and gender combinations, which means there are a lot of places where a wrong URL could quietly send someone into the wrong experience.

      Instead of hard-coding every full link separately, I used one customizer base URL and built the individual paths from there.

      Specific links can still override the base when a deeper customizer path is needed.

      That gives the site one place to update if the customizer path ever changes instead of forcing someone to hunt through dozens of templates and links.

      It also makes the whole system much easier to troubleshoot.
  - heading: Build the intro animation from the real logo
    body: |
      The design called for the Legends name to draw itself onto the screen before the hero loaded.

      There were a few ways I could have built it. I could have exported a video, used a GIF, or brought in something like Lottie.

      Instead, I converted the actual brand font into vector paths and animated the SVG stroke.

      That gave me a sharp version of the logo at any screen size without adding a large video or another animation library just for a short intro.

      It also meant the animation could use the site's colors and stay lightweight.

story:
  - heading: The build
    body: |
      The homepage is made up of several pieces that all have to work together.

      I built:

      - Hero video and load-in intro
      - Animated Legends wordmark
      - "Design Your Uniform" sport grid
      - Sport and gender customizer links
      - "We Are Legends" team wall
      - Team Favorites section
      - Slide-out mobile navigation
      - Footer navigation
      - ACF content controls
      - Responsive layouts
      - Mobile interactions
      - Video and image handling
      - Customizer handoff logic

      The goal was not just to match the Figma file.

      It had to feel like Legends while still working like a real production site.

      That meant adjusting spacing, interactions, responsive behavior, and navigation once everything was running in a browser instead of a static mockup.

hardProblem:
  punchline: Opening one gender in the mobile menu sometimes showed the other one, even though the menu logic was correct.
  problem: |
    The mobile menu has separate sport lists for men's and women's uniforms.

    After the menu was built, opening one of those views could leave the wrong list visible.

    At first it looked like a simple logic mistake. The two panels are nearly identical, so the obvious explanation was that the wrong view was being selected.
  assumption: |
    I checked the state and button bindings first. They were correct.

    That made me think it might be a stale asset or caching issue.

    After another refresh and test, the problem was still there.
  found: |
    I started capturing the menu during the actual interaction instead of only checking the final state. That showed the view logic was working. The problem was the scroll position.

    The two gender panels sit next to each other inside a horizontal overflow container. When I opened a panel, the script moved keyboard focus to the first link inside it.

    The browser was trying to help by automatically scrolling that focused element into view. Because the incoming panel was still positioned beside the current panel, that automatic scroll moved the whole container and could leave the wrong side visible.

    The menu logic was right. **The browser's focus behavior was moving the drawer.**
  fix: |
    I fixed the actual cause instead of trying to force the panel back into place afterward.

    I moved focus using `preventScroll: true`, which lets keyboard focus move without allowing the browser to scroll the container.

    I also changed the drawer so the overflow could not be manually scrolled into the wrong position.

    That stopped the movement at the source.
  verified: |
    I repeated the exact interaction at mobile and desktop widths.

    I opened the men's view and captured it. Then I opened the women's view and captured that. Each button now consistently opened the correct list.

    I also checked the container's scroll position after the view changed. If that value moves again in the future, it gives me a clear signal that the bug has come back.
  code:
    - snippet: legendsFocus
    - snippet: legendsDrawer

result: |
  Legends now has a storefront that feels like its own brand while still connecting cleanly into the uniform customizer.

  The intro animation, hero, uniform grid, team content, navigation, and footer all work together as one experience instead of feeling like separate pieces.

  The most important part is the handoff into the customizer.

  A dealer, coach, or team can choose the sport and gender they need and get sent into the correct uniform design flow without needing to understand the systems behind it.

  The site also gives marketing much more control than a hard-coded homepage would have. Photos, videos, copy, links, and other content can be updated through WordPress without needing me to change the template every time.

  I do not have a conversion or customizer-entry number I can verify for this project, so I am not going to attach one.

  What I can stand behind is that the homepage, navigation, footer, and customizer links now work together as one responsive system and are much easier for the marketing team to manage.

differently: |
  I would fill the real content into the ACF fields earlier in the build.

  Because the theme had good fallback content, the page could look finished even when some sections were still pulling from code. That made it less obvious during review which areas had already been connected to WordPress. Pre-filling the fields from the beginning would have made that clearer.

  I would also make the cache-clear and staging process part of the deployment setup from day one.

  More than once, something that looked like a code problem was really a hosting cache that had not updated yet. Having that process documented at the start would make reviews and releases smoother.

