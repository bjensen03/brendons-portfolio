situation: |
  Legends is its own sportswear brand, and its custom team uniforms are designed in a separate uniform customizer.

  The Legends website is the branded storefront for those uniforms. Legends didn't have a website before this one.

  Someone visiting the site should feel like they are shopping through Legends, even though the uniform design flow runs on its own system underneath.

  That made the project more than just building another landing page.

  The site had to feel like Legends, follow its brand direction, and still connect cleanly into the existing uniform customizer.

  A dealer, coach, or team should be able to land on the Legends site, choose the sport and uniform they need, and move into the correct design experience without needing to understand the systems working behind the scenes.

  My job was to build that front-end experience and make that handoff feel seamless.

myRole: |
  On Legends I owned the homepage development.

  The Sage 11 theme, Tailwind setup, and overall brand direction were already in place.

  I worked from the design team's Figma files and built the actual experience inside WordPress.

  That included the hero video, animated intro, uniform sport grid, team wall, favorites section, slide-out navigation, footer, responsive behavior, ACF fields, and the links into the uniform customizer.

  I did not build the customizer itself.

  My responsibility was making sure the Legends experience handed users into it correctly every time.

  That meant each sport, gender, and call to action had to point to the right place without turning the site into a mess of hard-coded links.

