story:
  # The one "site today" section, kept short on purpose.
  - heading: The site today
    body: |
      The website is a custom WordPress theme I designed and built, with no page builder. ACF Pro drives the content on every template, Rank Math handles SEO, a Formidable form takes brand partnerships and everyone else, and Mailchimp runs the Join the Trek newsletter.

      It serves both audiences — the journal and trail guides for the people who follow along, the Collaborations page and the media kit for brands — and it shipped with empty fields instead of placeholder content, so ==nothing fake can render== on a brand built on real photos.

      [See the site](https://thetwilighttrekkers.com/)
  - heading: Shipping it
    body: |
      The rebuild ran from a written spec to a task-by-task plan to commits, one task at a time, each leaving the theme working.

      The theme carries version 2.0.0, because this was a clean rebuild of templates that already existed, not a first attempt.

      Handing someone an empty CMS and a login is how most rebuilds end, and it's why so many of them sit unfinished.

      This one ==shipped with a launch plan== instead: every page prioritized, the whole thing time-boxed into five evening sessions of about an hour, and the actual copy — headlines, story paragraphs, the first journal post — written and ready to paste.

      The content problem is the one that kills rebuilds, so it got planned like the code did.

  - heading: The content model, in git
    body: |
      WordPress stores ACF field definitions in the database.

      That means the shape of every page lives somewhere that can't be code-reviewed, can't be diffed, and doesn't travel with a deploy.

      On a site where all nine templates are ACF-driven, that turns the database into ==an undeclared dependency of the theme==. A field renamed in production silently empties a section, and there is no commit anywhere that explains why.

      All sixteen field groups are committed as JSON in the theme's `acf-json/` directory.

      The content model is version-controlled alongside the templates that read it, so ==a change to page structure arrives as a reviewable diff== rather than as an undocumented edit made in an admin screen at some point in the past.

