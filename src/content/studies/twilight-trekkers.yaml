keyDecisions:
  - heading: Ship empty fields, not placeholder content
    body: |
      No stock images, no lorem ipsum, no "Your headline here" rendered to a live page. ==An unfilled section renders as nothing at all.==

      That costs you a site that looks finished on day one.

      It buys you a site that can never accidentally publish something fake — which for a brand whose entire value is that the photographs are real is not a small thing.
  - heading: Keep the media kit out of the menu
    body: |
      The media kit is its own template, kept out of the navigation entirely.

      It exists for exactly one audience, and brands get the link directly. Putting it in the menu would have ==advertised to the other audience that they're being marketed at==.
  - heading: One feed, not three sections
    body: |
      Journal entries, photo essays and gear reviews could have been three sections.

      Nobody would have navigated between them. They share ==one feed with category tabs== instead.
  - heading: Let the photographs be the loudest thing
    body: |
      Light and editorial, not dark and heavy. Serif headings, a soft palette, plenty of white space.

      On a photography site, ==the photographs being the loudest thing on every screen== is the only defensible hierarchy.

hardProblem:
  title: Content for brands and followers
  punchline: What our followers engage with keeps changing. It took a lot of trial and error, and it still does.
  problem: |
    The hardest problem is making reels and content that work with brands, while staying on top of our followers.

    That means ==knowing what our followers actually want to engage with==.
  assumption: |
    I figured that if our followers liked something, doing the same thing again would land the same way.
  found: |
    It doesn't. They like something, then we do the same thing and they don't.
  fix: |
    So we test a lot, to see ==what actually catches our followers' attention== and what brings in new ones.
  verified: |
    It's ongoing. There's no point where this is solved, so the testing never stops.

result: |
  This project established Twilight Trekkers as ==a recognizable outdoor brand== by combining photography, videography, and storytelling to inspire exploration and connect with a growing community of adventurers.

  About 26k people follow along on Instagram, and we've worked with 34 brands, stays and excursions.

