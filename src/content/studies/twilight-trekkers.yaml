situation: |
  Twilight Trekkers began as a passion project built to capture the beauty of outdoor adventure through photography, storytelling, and design.

  It has grown to ==about 26k people following along on Instagram==, and to brand work with 34 brands, stays and excursions.

  So the content has two audiences. A brand wants its trip, its stay or its gear shown well. The people who follow us want the places, the trail guides and the photos.

  The reels, the photos and the posts have to ==work for the brands and keep our followers engaged== at the same time.

myRole: |
  This is the one project on my site where I was also the client.

  We started The Twilight Trekkers in 2021. I created the brand from the ground up, developing its visual identity and growing a community of outdoor enthusiasts through authentic, creative content.

  What I do for it:

  - **The drone.** I ==fly the drone and make the drone videos==.
  - **Photos and video.** I shoot some of the photos and videos for our travel page, @thetwilighttrekkers. Kaylee is our photographer, so most of the photos are hers.
  - **The blog.** I write the blog posts.
  - **The website.** I set the design direction, ==built the custom theme==, and I run it: SEO, image optimization, publishing and analytics.

