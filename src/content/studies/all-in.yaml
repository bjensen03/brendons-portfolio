features:
  - id: rules-phone
    heading: The rules on a phone
    body: |
      The phone version is ==where the red background hurt most==.

      After: white page, black text, bigger headline, and the sections sit in a bar that stays with you as you scroll.

      Every button and section is the same as before, and so is the wording, apart from the rules that were updated.
    media:
      - src: all-in/rules/before-phone-screen.webp
        alt: The old rules page on a phone, white text on a solid red background.
        caption: Before.
      - src: all-in/rules/after-phone-screen.webp
        alt: The rebuilt rules page on a phone, black header and white page.
        caption: After.
  - id: emails
    heading: The emails are the product
    layout: stack
    body: |
      The form was a fifth of the work. ==What mattered was what happened after someone pressed submit.==

      Three emails: a receipt to the coach that says plainly that registering does not reserve a spot, a notice to the tournament with every contact detail and a link straight to the board, and the acceptance email carrying the Venmo code and a card payment link with that team's own division and name written into the instructions, so a two hundred dollar payment can be matched to a team without anyone guessing.

      Two things I got wrong on the first pass and caught before anyone saw them.

      The images were linked using the address of the incoming request, which comes out as localhost behind the server's proxy — ==every email would have arrived with a broken Venmo code==, which is the one thing that email exists to carry.

      And the emails were being sent before the page answered, so a coach would have sat watching a spinner while two mail servers took their time. On the first of November, with everyone submitting at once, that is how you get duplicate registrations. The form now answers in a third of a second and the emails follow behind it.
    media:
      - src: all-in/emails/1-received.webp
        alt: The confirmation email a coach receives after registering.
        caption: Sent the moment a coach registers. Says plainly that the form does not reserve a spot.
      - src: all-in/emails/2-accepted-how-to-pay.webp
        alt: The acceptance email, with Venmo and card payment options.
        caption: Sent when staff accept a team. The division and team name are filled in for them, so the payment can be matched.
      - src: all-in/emails/3-staff-notice.webp
        alt: The notification the tournament receives when a team registers.
        caption: What the tournament gets, with a link straight to the board.

