# Quick overview: the condensed read (2–3 minutes), shown by the
# Quick overview / Full case study switch. The full study above is unchanged.
overview:
  glance: true
  hook: Inside a live SvelteKit app owned by another engineering team, I rebuilt the front end and **built its 2027 registration end to end**.
  sections:
    - heading: What I built
      body: |
        The registration is the form, its database storage, a staff board and three emails, front end and back end.

        The front end comes from the designer's Figma files, and the redesign shipped through **four production releases**, with the homepage images cut from 3.5 MB to 1.8 MB.
      labels: ['SvelteKit', 'Svelte', 'Tailwind CSS']
      show: ['scroller']
    - heading: Working inside their app
      body: |
        Engineering owns the API, brackets, team management and releases, and the app runs on an early SvelteKit and an old Node. I pinned Node with Volta instead of upgrading, and moved the Shop and Brackets settings into the server-side load, which ended the Shop link flicker.
      labels: ['Volta', 'SvelteKit server load']
      show: ['viewer:registration']
    - heading: Engineering Deep Dive
      body: |
        Right after my flicker fix shipped, Shop started sending some visitors back to the homepage, though every test had passed. The guard read a value only the homepage set, kept in **server state shared between visitors**, so one homepage visit made the check pass for everyone.

        I switched it to the activation flag the server loads for every request, and proved it on a fresh production build that never opened the homepage.
      labels: ['SvelteKit', 'Server state', 'Production builds']
      show: ['hardProblem']
    - heading: Reflection
      body: |
        I should have searched the project for anything else using the old Shop check. There was one other place, with a TODO above it.
      labels: ['Code search', 'QA']
