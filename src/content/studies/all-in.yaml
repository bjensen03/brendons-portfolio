# "In short" — every line is taken from this file: the situation and the
# result.
inShort:
  - The Register button on the live site led to a page that still said ==“2025 Registration is full.”== There was no way for a team to register.
  - I built ==a full registration form for 2027==, saved to the database rather than only emailed, with a staff board and three emails that did not exist before.
  - I rebuilt the rules, brackets page, navigation, homepage, and footer of ==a live SvelteKit app== owned by an engineering team in the Philippines.
  - Every change shipped through ==DEV, staging, QA, and production==, without getting in the way of the tournament systems the engineering team already owned.

