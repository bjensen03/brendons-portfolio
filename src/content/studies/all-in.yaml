situation: |
  ALL IN is a youth baseball tournament run by PROLOOK, with profits going to the Autism Council of Utah.

  The site was originally built in 2022 on an early version of SvelteKit and was still locked to an older version of Node. The app itself was owned by an engineering team in the Philippines, and upgrading the framework or dependencies was not something I could casually touch without risking other parts of the system.

  ==Marketing needed a full redesign before the next tournament.==

  The homepage was still showing last year's dates, the navigation needed to be rebuilt, and the overall site needed to feel much more current.

  The people using the site are also not sitting at a desk.

  A parent might be standing at the ballfield checking the bracket to see where their kid plays next. A coach might be pulling up the tiebreaker rules on their phone. A team manager might be trying to order gear between games.

  If one of those paths breaks, the problem is immediate.

myRole: |
  I was the full-stack developer on the marketing side.

  My job was the front end of the redesign, built from the designer's Figma files and shipped through the existing DEV, staging, QA, and release process.

  Most of my work was in Svelte and Tailwind.

  I rebuilt the navigation, homepage, footer, and shared components, then worked through QA issues as they came back. Some of those changes also touched how page data was loaded on the server, when the front end needed information before the page rendered.

  I built the 2027 registration end to end, front end and back end: the form, saving each registration to the database, the staff board, and the three emails.

  Engineering owned the rest of the application, including the API, bracket logic, team management, and production releases. I did not build those systems.

atAGlance:
  - value: 4 production releases
    label: Included my work
    note: Changes were released in smaller pieces instead of waiting for one large launch.
  - value: 3 emails
    label: That did not exist before
    note: A receipt to the coach, a notice to the tournament, and the acceptance email.
  - value: 3.5 MB → 1.8 MB
    label: Homepage image weight
    note: Without a visible change in quality.

keyDecisions:
  - heading: Work inside the old stack instead of turning the redesign into an upgrade project
    body: |
      My first instinct was to look at upgrading it.

      ==That would have been the wrong project.==

      The engineering team already deploys and maintains the application, and changing framework versions or dependencies would have affected parts of the system I did not own.

      Instead, I pinned the exact Node version with Volta so this project always runs in the environment it expects without affecting anything else on my machine.

      That let me focus on the redesign instead of creating a second project around tooling.
  - heading: Load Shop and Brackets settings on the server
    body: |
      Marketing can turn the Shop and Brackets sections on or off.

      Originally, the navigation checked those settings in the browser after the page had already loaded. That meant the Shop link could appear a moment late after every refresh.

      I could have hidden the flicker visually, but that would not have fixed the reason it happened.

      Instead, I moved those settings into the server-side load so ==the page already knows whether Shop and Brackets are active before the first render==.

      That removed the flicker, removed two extra API calls from every page, and also fixed a quieter problem where the footer did not always know whether the Shop was enabled.
  - heading: Use live text instead of titles baked into images
    body: |
      The design had RULES, TEAMS, BRACKETS, and SPONSORS built directly into the homepage images.

      They looked good in the mockup but came out blurry when the images scaled. A larger image export would only fix one screen size.

      I rebuilt those titles as live text instead.

      I measured the placement from the design and matched the same proportions so the text stayed in the same visual position across different screen sizes.

      Now the titles stay sharp, can scale with the layout, and can also be read by screen readers.
  - heading: Scale the buttons with the layout instead of copying one fixed Figma size
    body: |
      The design called for a 265 by 83 pixel button.

      That works at the exact screen size the mockup was designed for. It does not work everywhere else. At some widths it becomes too large. At others it feels too small.

      Instead of locking it to one fixed size, I kept the same proportions and sized it relative to the tile.

      That keeps the button visually consistent from smaller laptops up through large desktop screens.

story:
  - heading: Someone else's release process
    body: |
      Every change went through QA.

      The tester would send back a spreadsheet with the problem, steps to reproduce it, and sometimes a screen recording.

      The first rounds caught things like a missing profile icon, menus that stayed open after a link was tapped, and a footer that was not respecting the Shop setting.

      Each one came back through the same cycle. Reproduce it. Find the cause. Fix it. Capture the before and after. Send it back through QA.

      Some changes were less about bugs and more about making the new design hold up properly.

      The WE ARE ALL IN wordmark in the footer was being stretched beyond the resolution of the original image on large screens, so I replaced it with a higher-resolution version.

      I also reduced the homepage image weight ==from about 3.5 MB to 1.8 MB== without a visible change in quality.

  - heading: Registration was just an email
    body: |
      The tournament sells out in about a day.

      When they asked me to build registration for 2027, I went looking for what existed. There was a form on the teams page that collected five fields and emailed them to a staff address. Nothing was stored. Someone read the email and typed the team into the admin by hand.

      ==So this was not reviving something. It was building it.==

  - heading: What the site should decide
    body: |
      The tournament director wanted to pick which teams got in. Their own form said first come, first served.

      I raised it once, then built what he asked for, because ==which teams play is his call and not mine==. What I could do was make the consequences visible: a board that shows each division against its cap, so accepting a seventeenth team into a sixteen-team division is not possible by accident, and a waitlist that keeps the order teams registered in, so the February deadline has an answer ready when someone does not pay.

      The part I pushed back on was the interface. He asked for drag and drop. He will be using it on a phone, on the first of November. ==Dragging a card on a phone, in that hour, is worse than tapping a button.== I built buttons, and said I would revisit it after he had used it for real.

  - heading: Testing a one-day sellout
    body: |
      Registration opens on the first of November and the tournament sells out that day. There is no second attempt.

      So the form unlocks itself on the test sites and stays shut on the live site until the date, which meant QA could run the whole flow while the public page still said "Registration opens November 1". The notification that normally goes to the tournament director goes back to whoever filled in the form when it is sent from a test site, so ==testing it fifty times does not put fifty fake teams in his inbox==.

hardProblem:
  title: Passed every test, broke the Shop
  punchline: I fixed a flickering Shop link, every test passed, and it still broke the Shop on the live site because the page trusted a value the server was sharing between visitors.
  problem: |
    Right after the Shop flicker fix shipped, QA found another problem. Opening Shop in a new tab or reloading the Shop page sent the user back to the homepage.

    Clicking Shop normally from the homepage still worked. That made it look random.
  assumption: |
    The frustrating part was that I had already tested it.

    Before the release, I opened Shop from the Rules and Sponsors pages on my local server and landed on Shop every time. Same code. Same data. Clean pass.

    Because it worked locally but failed after deployment, I assumed something in the live environment, probably caching, was behaving differently.
  found: |
    The problem was not actually the Shop link.

    The Shop page had a guard that checked a stored value before allowing the page to load. Only the homepage was setting that value.

    The bigger problem was that ==the value lived in server state that was shared between visitors==. Once somebody loaded the homepage, that value became active and made later tests pass even when the logic was wrong.

    The old navigation code had also been setting that value on every page as a side effect. When I removed that code to fix the flicker, I exposed the older bug underneath it.

    There was even an old note above the guard saying:

    > "fix redirection bug cannot visit page"

    The redirect had been worked around before, but the dependency was still there.
  fix: |
    I changed the Shop guard so it used ==the activation flag the server already loads for every request==.

    That is the same source of truth used by the navigation and footer. The actual change was only a few lines.

    I could have put the old navigation behavior back, but that would have brought the flicker back and kept the Shop dependent on whatever state happened to be loaded on the server.
  verified: |
    My local development server could not reliably reproduce the bug, so I stopped using it as proof.

    I built the application for production and ran it on a fresh server without opening the homepage first. That finally reproduced the real behavior. The old build redirected away from the Shop. The fixed build opened it correctly.

    Then I went through every case from QA's sheet:

    - Open Shop in a new tab
    - Reload while already on Shop
    - Open Shop from the homepage
    - Open Shop from Rules
    - Open Shop from Sponsors
    - Check navigation and footer links
    - Turn Shop off and confirm the redirect still happens when it should

    After that, I repeated the checks on staging before the next release.
  code:
    - snippet: shopGuard
      caption: The Shop guard uses the activation flag the server already loads for every request.
    - snippet: shopNav
      caption: The same source of truth used by the navigation and footer.

# Opening day is November 1. How it went (teams registered, how fast the
# divisions filled) can go in a paragraph after "Teams now have a real way to
# register…" below, with real numbers only.
result: |
  The experience works better for the people actually using it during the tournament, especially on mobile.

  Parents can get to brackets. Coaches can reach rules. Team managers can get to the Shop.

  Marketing also has someone on the front-end side who can make updates without every request waiting on an engineering team working in another timezone.

  Teams now have a real way to register for 2027, and staff have a board to decide who plays.

  I do not have access to the site's analytics, so there is no traffic or conversion number here. I would rather say that than invent one.

  What I can stand behind is that ==the redesign shipped through four production releases==, the major navigation and Shop issues were fixed, and the site is much easier to use and maintain than where it started.

differently: |
  When I removed the navigation's old Shop check, I should have searched the rest of the project for anything else depending on it.

  There was exactly one other place. It already had a TODO note sitting above it.

  ==That search would have taken a minute== and probably saved the production bug.

  I would also test layout issues on a real phone earlier. At one point I spent hours chasing a mobile layout problem that only existed inside a simulated browser. On an actual phone, the page was fine.

  Now I treat browser simulation as useful, but not proof.

