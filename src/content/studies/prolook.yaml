# Quick Overview: the condensed read behind the "Quick overview | Full case
# study" switch. Built from this file's own sections; every sentence is
# backed by a line above.
overview:
  glance: true
  hook: Marketing brings me the work that can't wait weeks for the normal development queue, and I get it live, sometimes **by the next morning**.
  sections:
    - heading: What I built
      body: |
        I built the PRO-AI landing page **in about a week from design to live**, and it took **about 5,000 submissions from July to September**.

        The overnight one was the Denver Athletic partner page: five sections, live in time for a client demo.
      labels: ['WordPress', 'Sage 9', 'Blade', 'ACF']
      show: ['scroller']
    - heading: How I work in their theme
      body: |
        I'd never worked in Sage 9 or Blade, so I learned the existing theme instead of replacing it. Marketing controls the parts of a page they change through ACF, the layout stays in code, and I build what the theme doesn't have, like GSAP animation and video sections.

        I also work on ALL IN Tournament, which has its own study.
      labels: ['ACF', 'GSAP', 'SCSS']
      show: ['viewer:homepage-hero']
    - heading: Engineering Deep Dive
      body: |
        A fix worked locally, but production kept showing the old label. The deployed template matched mine **byte for byte**: production was running an old compiled Blade file that no cache tool could clear, and I had no shell access.

        I moved the section into a new partial. Blade compiled it fresh, and the right label appeared on the next deploy.
      labels: ['Blade', 'SFTP']
      show: ['hardProblem']
    - heading: Reflection
      body: |
        I'd want a staging environment that mirrors production, so a problem like the Blade compile cache shows up somewhere safe first.
      labels: ['Staging', 'Git']
