situation: |
  PROLOOK already had a development team and an established website, but marketing had a different problem.

  ==They needed somebody who could move fast.==

  Campaigns, landing pages, partner pages, website updates, and sales projects sometimes needed to go live within a day or within the same week. When those requests had to go through the normal development process, they could take ==a couple of weeks or sometimes longer== depending on what else was already being worked on.

  That was one of the main reasons I was brought in as a contractor.

  They needed somebody on the marketing side who could take a request, figure out what needed to happen, communicate with the people involved, build it, test it, and get it live without turning every request into a long development cycle.

  The website is also being used by coaches, athletic directors, dealers, partners, and teams who are trying to understand PROLOOK's products or take the next step. Moving quickly only matters if the finished page is still clear and useful for the person on the other side of the screen.

myRole: |
  I work between PROLOOK's marketing team and its existing development environment.

  I was not brought in to rebuild the entire platform or replace the other development team. My role is different.

  When marketing needs a landing page, campaign page, website update, animation, form, partner page, navigation change, or something fixed quickly, I can take that project and move it forward.

  A big part of my job is also figuring things out.

  Before working with PROLOOK, ==I had never worked inside a Sage 9 or Blade codebase.== I had to learn how their theme was built while also completing real production work.

  I learned where things lived, how the site was structured, how their deployment process worked, what I could safely change, and what parts of the platform belonged to another team.

  At first, they gave me work to see how I handled the codebase and their process.

