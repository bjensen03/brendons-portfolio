keyDecisions:
  - heading: Make marketing work move at marketing speed
    body: |
      The biggest thing I try to solve is the gap between how quickly marketing needs something and how long a normal development process can take.

      If marketing needs a text change, new image, product update, campaign section, or new landing page, I try to build it in a way that does not create another development request the next time something changes.

      That usually means giving marketing control over the right parts of the page through ACF while keeping the actual layout and functionality controlled in code.

      The goal is not to make everything editable.

      ==The goal is to make the things marketing actually changes editable.==

      That helps marketing move faster without giving up the structure and consistency of the site.
  - heading: Work inside the existing system instead of trying to replace it
    body: |
      PROLOOK's main WordPress theme uses Sage 9, Blade, PHP, SCSS, Foundation, Webpack, and ACF.

      Some of that stack is older, but it already supports a large production website and another development team works inside it.

      I could have looked at it and decided everything needed to be rebuilt.

      ==That would not have helped anybody.==

      Instead, I learned the existing setup and made smaller changes where they made sense.

      That lets me move quickly without turning every marketing request into a much larger engineering project.
  - heading: Build what the project actually needs
    body: |
      Some of the requests I get are not normal WordPress page updates.

      Marketing might want a certain animation, video behavior, navigation experience, interactive section, or something from a design that does not already exist in the theme.

      ==My job is usually to figure out how to make it work.==

      That has included custom GSAP animations, scroll effects, video sections, rotating logos, reusable sliders, responsive fixes, forms, navigation changes, and other custom front-end work.

      Sometimes I already know exactly how to build it.

      Other times I have to research it, test different approaches, and figure it out as I go.

      That is a big part of what I bring to the team. They can give me something difficult or something I have not done before, and I will work through it.

story:
  - heading: 'A major launch: PRO-AI'
    body: |
      One of the biggest examples of this was the PRO-AI landing page.

      I received the design with ==about a week to turn it into a finished live page.==

      This was not a situation where I got a final design, disappeared for a week, and came back with a finished website.

      I was communicating with the head of marketing, the head of sales, and other people involved with the launch while I was building it.

      Content changed. Feedback came in. Parts of the experience needed adjustments. I was making those changes while still keeping the launch moving forward.

      The finished page included a video-led hero, information explaining how PRO-AI worked, what users needed to submit, help content, forms, and the full submission flow.

      I handled the development, changes, testing, and publishing of the page.

      It went live on schedule.

      From July to September, it received ==about 5,000 submissions==.

      That project was also important because it showed the team what I could handle. After that, larger landing pages and faster-turnaround marketing projects became a regular part of my work.
  - heading: Ongoing marketing development
    body: |
      PRO-AI was not a one-time project.

      PROLOOK regularly needs new landing pages, campaign pages, website updates, and partner experiences. A lot of that work happens every couple of weeks.

      Some of the work I have handled includes:

      - PRO-AI landing page development
      - Denver Athletic partner landing page
      - Homepage updates
      - A new navigation experience
      - Superior Fit product section updates
      - Team page improvements
      - Reusable CTA components
      - Lead capture forms
      - Production debugging
      - Deployment coordination

      The important part to me is not whether the task sounds big or small.

      It is that ==the team knows they can hand me something and I will work through it.==

hardProblem:
  punchline: The file on production was byte-for-byte correct. Production was still running the old version of it.
  problem: |
    One product section used a pipe character to tell the design where a line break should happen.

    Customers were seeing the actual pipe instead.

    I updated the Blade template so it would split the text at the pipe and display the label correctly.

    It worked locally. I deployed the updated theme. Production still showed the pipe.
  assumption: |
    My first thought was cache.

    I cleared Autoptimize, cleared the normal hosting cache, hard-refreshed the page, and confirmed the front-end assets were current.

    Nothing changed.
  found: |
    I downloaded the actual production template through SFTP and compared it with my local file.

    They were identical byte for byte.

    That changed the problem. The correct source code was on production, but production was not executing it.

    Sage 9 uses Blade templates, which get compiled into regular PHP files. Production was still using an older compiled Blade file even though the source template itself had already been updated.

    The normal caching tools available to me did not clear that Blade compile directory, and I did not have shell access to clear it directly.

    The source was fresh. ==The executable file was not.==
  fix: |
    Instead of continuing to fight a compiled cache I could not directly access, I moved that section into a new Blade partial.

    That gave Blade a source path it had never seen before.

    Since there was no old compiled version connected to that path, Blade had to compile it again from scratch.
  verified: |
    I deployed the new partial and refreshed production. The correct label appeared immediately.

    That problem also changed how I think about sections that are edited often or touched by multiple developers.

    Where it makes sense, separating those areas into smaller partials makes them easier to work on, easier to troubleshoot, and easier to isolate when something goes wrong.
  code:
    - snippet: bladeLabel
      caption: The section in its new Blade partial. Blade had never seen that path, so it compiled it from scratch.

result: |
  ==The biggest result of my work at PROLOOK is trust.==

  I was originally brought in because they needed somebody who could help marketing move faster.

  They gave me a chance to prove that.

  As I completed projects quickly, communicated clearly, figured out problems, and got work live, I started being trusted with bigger and harder projects.

  Now I can be given a landing page, campaign, animation, site update, production issue, or project with a short deadline and take ownership of getting it finished.

  Some requests that might otherwise have waited for the next development release can now be handled ==the same day or the next day.==

  I do not own PROLOOK's full analytics dashboard, so I am not going to attach conversion numbers to work when I cannot verify them.

  What I can stand behind is the work I shipped, how quickly I shipped it, and the amount of responsibility I have been trusted with since joining the team.

differently: |
  The first thing I would change is the staging setup.

  I would want a staging environment that mirrors production much more closely. That would give production-only issues, like the Blade compile-cache problem, somewhere safe to show up before customers see them.

  I would also move more of the deployment process toward Git instead of archive-based theme imports. That would make the repository the source of truth instead of relying as heavily on a manual deployment process between multiple developers.

  Finally, I would create a simple visual guide for the marketing team showing which ACF fields control which parts of the site.

  Building editable fields saves development time, but ==it only really works if the person using them knows exactly where everything goes.==

