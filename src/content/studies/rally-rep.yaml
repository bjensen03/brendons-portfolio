inShort:
  - Rally Rep is the dealer-facing division of Rally Trailer Manufacturing. Its reps connect crews with equipment from partners like Dura-Line, CommScope and VeEX.
  - I designed and built its website, with ==a page for each partner==, a map that points you to your regional rep, and a "Click for Your Rep" call tab at the top of every page.
  - I also handled the marketing for Rally Connects, the tradeshow Rally Rep hosted at Rally HQ in Mona, Utah, from ==the event emails== to the banners and signage.

