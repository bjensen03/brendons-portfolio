story:
  - heading: Rally Connects Tradeshow
    body: |
      The Rally Connects Tradeshow was one of the biggest projects I helped bring to life at Rally Trailer.

      What started as a small idea to host around 100 people turned into ==a packed event with over 250 attendees==, including Utah Governor Spencer Cox, who came and gave a speech.

      I handled the marketing side of the event—from designing flyers, emails, and social posts to creating banners and signage that tied everything together.

      I also helped capture photos and videos throughout the event and worked with the team to make sure everything ran smoothly.

      The tradeshow was a huge success, not just for turnout but for ==the connections, partnerships, and attention it brought to Rally==.

