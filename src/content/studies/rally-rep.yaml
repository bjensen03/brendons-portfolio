# Small study. The tradeshow section is from my old Webflow case study. In
# short, the situation, my role and the result come from my own lines plus
# what is visible on rallyrep.com: the eleven Infrastructure Partners pages in
# the menu, the regional rep map, the "Click for Your Rep" call tab, and the
# Any Part You Need / Reel Trailers / Equipment Source sections. "The
# dealer-facing division of Rally Trailer Manufacturing" is from my old About
