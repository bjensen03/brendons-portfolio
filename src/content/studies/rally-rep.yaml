situation: |
  Rally Rep covers telecom, power and gas infrastructure, with eleven partners from Dura-Line and CommScope to Oldcastle and VeEX.

  So the site is built around two questions: who makes what I need, and who is my rep?

myRole: |
  I designed and developed the site in WordPress with Divi Supreme Pro and Elementor, plus custom HTML and CSS.

  The home page leads with a slider of partner brands, each with a button to that partner's website, then sections for Reel Trailers, Any Part You Need and Equipment Source that send you to the partners. Each partner has its own page, and the Find Your Rally Rep page puts a map of the regions next to the phone number.

  Outside the website I handle Rally Rep's email campaigns and trade show materials, and I keep working on the site so it stays fast and easy to use.

